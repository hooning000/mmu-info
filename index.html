<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMU INFO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* ── 시안 3 · 노을 수채 ── */
  :root {
    --sea:#2F6C9F;     /* 아이콘, 링크 */
    --wave:#BFDDF0;    /* 테두리, 구분선 */
    --foam:#EEF6FB;    /* 버튼과 카드 바탕 */
    --buoy:#C8442F;    /* 메인 공지 카드 뱃지에만 사용 */
    --ink:#1E3448;     /* 본문, 제목 글씨 */
    --ink-sub:#4F647A; /* 보조 글씨 */
    --sky:#BCD8EE;     /* 그림 패널 배경(이미지 로딩 전·실패 시) */
    --bg:#FFFFFF;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:400 16px/1.6 "Noto Sans KR", -apple-system, sans-serif;
         word-break:keep-all; overflow-wrap:anywhere; }  /* 한글을 단어 단위로 줄바꿈 */
  button { font-family:inherit; }
  [hidden] { display:none !important; }
  .ic { fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }

  /* ── 전체 틀 ──
     · 폰·태블릿 세로 등 좁거나 세로로 긴 화면: 바다 블루(파란 헤더 + 물결)
     · 폭 900px 이상이면서 가로로 긴 화면(노트북, 태블릿 가로): 노을 그림 좌우 분할 */
  .layout { display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; }
  .art { position:relative; flex-shrink:0; min-height:236px; padding:34px 16px 52px; background:var(--sea); text-align:center; }
  .art-img { display:none; }
  .art-title { color:#fff; }
  .mascot { display:block; height:96px; width:auto; margin:0 auto; }  /* 닻 마스코트 (배경 투명) */
  .logo { font-weight:800; font-size:36px; letter-spacing:3px; line-height:1.2; margin:6px 0 4px; color:#fff; }
  .tagline { font-size:14px; margin:0; color:#fff; }
  .art-wave { position:absolute; left:0; bottom:-1px; display:block; width:100%; height:46px; }
  .w-back { fill:var(--wave); }
  .w-front { fill:var(--bg); }
  /* 좁은 화면에선 헤더를 메인에서만 보여줌(정보·공지 화면은 바로 내용부터) */
  .layout:has(#page:not([hidden])) .art { display:none; }

  .main { display:flex; flex-direction:column; min-width:0; padding:10px 16px 0; }
  .inner { width:480px; max-width:100%; margin:0 auto; }
  #home { display:flex; flex-direction:column; gap:14px; }
  footer { margin-bottom:16px; }
  .foot-waves { display:block; flex-shrink:0; width:100%; height:56px; margin-top:auto; }  /* 화면 바닥에 붙음 */
  .fw-back { fill:var(--foam); }
  .fw-front { fill:var(--wave); }

  /* ── 메인화면: 버튼과 카드 ── */
  .wide { display:flex; align-items:center; justify-content:center; gap:10px; height:60px; border-radius:999px;
          background:var(--foam); border:1.5px solid var(--wave); color:var(--ink); text-decoration:none; font-weight:800; font-size:18px; }
  .wide .ic { width:22px; height:22px; color:var(--sea); }
  .home-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .tile { position:relative; height:176px; border-radius:24px; background:var(--foam); border:1.5px solid var(--wave); color:var(--ink); text-decoration:none;
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
  .tile-icon { display:grid; place-items:center; width:52px; height:52px; margin-bottom:6px; border-radius:50%; background:#fff; border:1.5px solid var(--wave); }
  .tile-icon .ic { width:26px; height:26px; color:var(--sea); }
  .tile-title { font-weight:800; font-size:22px; line-height:1.3; }
  .tile-desc { font-size:13px; color:var(--ink-sub); }
  .tile .cnt { position:absolute; top:12px; right:12px; margin:0; min-width:24px; height:24px; line-height:24px; padding:0 7px;
               border-radius:999px; background:var(--buoy); color:#fff; font-size:13px; font-weight:700; }
  .tile, .wide { transition:transform .15s; }
  .tile:active, .wide:active { transform:scale(.97); }
  #updated { font-size:13px; color:var(--ink-sub); text-align:center; margin:0; }

  /* ── 노을 수채: 왼쪽 그림 패널(스크롤해도 고정) + 오른쪽 내용 ── */
  @media (min-width:900px) and (orientation:landscape) {
    .layout { flex-direction:row; }
    .art { position:sticky; top:0; height:100vh; height:100dvh; min-height:0; padding:0; flex:0 0 40%; min-width:420px; max-width:640px;
           background:var(--sky); text-align:left; overflow:hidden; }
    .layout:has(#page:not([hidden])) .art { display:block; }
    .art-img { display:block; position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:40% 50%; }
    .art-title { position:absolute; left:56px; top:80px; color:var(--ink); }
    .mascot { height:128px; margin:0; }
    .logo { font-size:48px; letter-spacing:4px; margin:4px 0 2px; color:var(--ink); }
    .tagline { font-size:16px; font-weight:500; color:var(--ink); }
    .art-wave, .foot-waves { display:none; }
    .main { flex:1; padding:40px 48px; }
    .inner { width:560px; margin:auto; }  /* 짧으면 세로·가로 가운데, 길면 위부터 */
    footer { margin-bottom:0; }
    #home { gap:18px; }
    .wide { height:68px; font-size:19px; }
    .wide .ic { width:24px; height:24px; }
    .home-grid { gap:18px; }
    .tile { height:230px; border-radius:28px; }
    .tile-icon { width:64px; height:64px; }
    .tile-icon .ic { width:30px; height:30px; }
    .tile-title { font-size:24px; }
    .tile .cnt { top:16px; right:16px; min-width:26px; height:26px; line-height:26px; padding:0 8px; }
  }

  /* ── 정보·공지 화면: 상단바와 탭이 함께 위에 고정 ── */
  #page { padding-top:12px; }
  .head { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1.5px solid var(--wave); padding-top:4px; }
  .topbar { display:flex; align-items:center; gap:10px; }
  .back { display:inline-flex; align-items:center; min-height:44px; padding:0 16px; border-radius:999px; background:var(--foam); border:1.5px solid var(--wave);
          color:var(--ink); text-decoration:none; font-weight:700; font-size:14px; }
  .page-title { font-weight:800; font-size:22px; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; padding:10px 0; }
  .tab { min-height:44px; padding:0 16px; border-radius:999px; border:1.5px solid var(--wave); background:var(--bg); color:var(--ink); font-weight:700; font-size:14px; cursor:pointer; }
  .tab.on { background:var(--foam); border-color:var(--sea); }
  #view { margin-top:16px; }

  .card { scroll-margin-top:120px; border:1.5px solid var(--wave); border-left:5px solid var(--wave); border-radius:14px; padding:12px 14px; margin-bottom:12px; }
  .card.today { border-left-color:var(--sea); background:var(--foam); }
  .day { font-weight:800; font-size:16px; margin-bottom:6px; }
  .day small { font-weight:400; color:var(--ink-sub); }
  .badge { font-size:12px; font-weight:700; background:var(--bg); border:1.5px solid var(--sea); border-radius:999px; padding:0 8px; margin-left:6px; }
  .meals { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .meal h3 { display:inline-block; font-size:14px; font-weight:700; margin:0 0 4px; padding:2px 10px; border-radius:999px; background:var(--foam); border:1.5px solid var(--wave); }
  .card.today .meal h3 { background:var(--bg); }
  .meal ul { margin:0; padding-left:16px; font-size:13px; line-height:1.5; }
  @media (max-width:560px) { .meals { grid-template-columns:1fr; } }
  .post { display:block; text-decoration:none; color:var(--ink); border:1.5px solid var(--wave); border-radius:14px; padding:10px 14px; margin-bottom:8px; }
  .post:active { background:var(--foam); }
  .post b { font-weight:700; }
  .clip { width:16px; height:16px; margin-left:4px; vertical-align:-2px; color:var(--ink-sub); }
  .meta { font-size:13px; color:var(--ink-sub); margin-top:2px; }
  /* 상단 고정 공지: 박스를 거품색으로 채우고, '공지' 표시는 바다색 바탕에 흰 글씨로 진하게 */
  .post.pinned { background:var(--foam); }
  .post.pinned:active { background:var(--wave); }
  .pin { font-size:12px; font-weight:700; background:var(--sea); color:#fff; border:1.5px solid var(--sea); border-radius:999px; padding:0 8px; margin-right:6px; }

  /* ── 학사일정 달력 ── */
  .cal { border:1.5px solid var(--wave); border-radius:20px; padding:12px; }
  .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .cal-head strong { font-size:18px; font-weight:800; }
  .cal-nav { width:44px; height:44px; border-radius:50%; border:1.5px solid var(--wave); background:var(--foam); color:var(--ink); font-size:20px; font-weight:700; cursor:pointer; }
  .cal-nav:disabled { opacity:.35; cursor:default; }
  /* 가로 간격 0: 여러 날 일정의 박스가 칸 사이에서 끊기지 않게 이어 그림 */
  .cal-grid { display:grid; grid-template-columns:repeat(7, 1fr); column-gap:0; row-gap:4px; }
  .cal-wd { text-align:center; font-size:12px; font-weight:700; color:var(--ink-sub); padding:2px 0; }
  .cal-day { min-height:48px; padding:4px 0; border:1.5px solid transparent; border-radius:12px; background:none; color:var(--ink); font-size:14px;
             display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; }
  .cal-day .num { display:block; width:26px; height:26px; line-height:26px; border-radius:50%; font-weight:700; }
  .cal-day.hol { background:var(--foam); }
  .cal-day.today .num { background:var(--sea); color:#fff; }
  .cal-day.sel { border-color:var(--sea); }
  /* 목록에서 고른 일정의 기간: 위아래 선은 계속 잇고, 시작·끝(또는 주의 첫날·끝날)에서 둥글게 닫음 */
  .cal-day.rng { background:var(--foam); border-radius:0; border-color:var(--sea); border-left-width:0; border-right-width:0; }
  .cal-day.rng.rs { border-left-width:1.5px; border-top-left-radius:12px; border-bottom-left-radius:12px; }
  .cal-day.rng.re { border-right-width:1.5px; border-top-right-radius:12px; border-bottom-right-radius:12px; }
  .dots { display:flex; gap:3px; }
  .dots i { width:5px; height:5px; border-radius:50%; background:var(--sea); }
  .cal-legend { display:flex; gap:14px; justify-content:flex-end; margin-top:8px; font-size:12px; color:var(--ink-sub); }
  .cal-legend span { display:inline-flex; align-items:center; gap:5px; }
  .lg-dot { width:6px; height:6px; border-radius:50%; background:var(--sea); }
  .lg-hol { width:12px; height:12px; border-radius:4px; background:var(--foam); border:1.5px solid var(--wave); }
  .sch-title { font-size:16px; font-weight:800; margin:18px 0 8px; }
  .ev { display:block; width:100%; text-align:left; font:inherit; color:var(--ink); background:var(--bg); cursor:pointer;
        padding:10px 14px; border:1.5px solid var(--wave); border-radius:14px; margin-bottom:8px; }
  .ev.hit { background:var(--foam); border-color:var(--sea); }
  .ev-date { display:block; font-size:13px; font-weight:700; color:var(--ink-sub); }
  .ev-title { font-weight:500; }
  .hol-chip { font-size:12px; font-weight:700; background:var(--bg); border:1.5px solid var(--wave); border-radius:999px; padding:0 7px; margin-left:6px; }
  .empty { font-size:13px; color:var(--ink-sub); margin:0 0 8px; }
  .new { font-size:11px; font-weight:800; background:var(--bg); border:1.5px solid var(--sea); border-radius:999px; padding:0 7px; margin-right:6px; letter-spacing:.5px; }
  .cnt { display:inline-block; min-width:20px; margin-left:6px; padding:0 6px; font-size:12px; font-weight:700; line-height:20px; text-align:center; border-radius:999px; background:var(--wave); color:var(--ink); }
  .tip { background:var(--foam); border:1.5px solid var(--wave); border-radius:14px; padding:12px 14px; }

  /* ── 푸터 ── */
  footer { margin-top:18px; border-top:1.5px solid var(--wave); padding-top:10px; font-size:13px; line-height:1.6; color:var(--ink-sub); }
  footer a { display:inline-block; padding:10px 2px; color:var(--sea); }  /* 터치 영역 확보 */

  /* 움직임 줄이기 설정이면 애니메이션 끄기 */
  @media (prefers-reduced-motion: reduce) {
    * { transition:none !important; animation:none !important; scroll-behavior:auto !important; }
    .tile:active, .wide:active { transform:none; }
  }
</style>
</head>
<body>
<div class="layout">
  <!-- 그림 패널: 넓은 화면은 왼쪽 고정, 좁은 화면은 위쪽 띠 -->
  <header class="art">
    <img class="art-img" src="assets/sea.webp" alt="" width="632" height="972">
    <div class="art-title">
      <img class="mascot" src="assets/mascot.webp" alt="" width="231" height="320">
      <h1 class="logo">MMU INFO</h1>
      <p class="tagline">목포해양대학교 정보 앱</p>
    </div>
    <svg class="art-wave" viewBox="0 0 1440 100" preserveAspectRatio="none" aria-hidden="true">
      <path class="w-back" d="M0,38 C240,88 480,0 720,38 C960,78 1200,8 1440,44 L1440,100 L0,100 Z"/>
      <path class="w-front" d="M0,66 C200,30 440,96 720,62 C1000,30 1240,92 1440,60 L1440,100 L0,100 Z"/>
    </svg>
  </header>

  <main class="main"><div class="inner">
  <!-- 메인화면 -->
  <section id="home">
    <a class="wide" href="https://www.mmu.ac.kr/main" target="_blank" rel="noopener">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>홈페이지 바로가기</a>
    <div class="home-grid">
      <a class="tile" href="#info">
        <span class="tile-icon"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v8a3 3 0 0 0 6 0V3M8 3v18M17 3c-2 2-3 4.5-3 8h3v10"/></svg></span>
        <span class="tile-title">정보</span><span class="tile-desc">학식 · 학사일정</span></a>
      <a class="tile" href="#notice">
        <span class="tile-icon"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4M6 5h12l-3 3.5L18 12H6"/></svg></span>
        <span class="tile-title">공지</span><span class="tile-desc">해성공지 · 승선사관부</span><span id="noticeCnt"></span></a>
    </div>
    <div id="updated">불러오는 중…</div>
  </section>

  <!-- 정보·공지 화면 -->
  <section id="page" hidden>
    <div class="head">
      <div class="topbar"><a class="back" href="#">‹ 홈</a><span class="page-title" id="pageTitle"></span></div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div id="view"></div>
  </section>

  <footer>
    비공식 앱입니다. 정확한 내용은 학교 홈페이지에서 꼭 확인해 주세요.<br>
    원문:
    <a href="https://www.mmu.ac.kr/main/contents/todayMenu2" target="_blank" rel="noopener">식단표</a> ·
    <a href="https://www.mmu.ac.kr/main/acschedule" target="_blank" rel="noopener">학사일정</a> ·
    <a href="https://www.mmu.ac.kr/main/board/264" target="_blank" rel="noopener">승선사관부 공지</a> ·
    <a href="https://www.mmu.ac.kr/main/board/301" target="_blank" rel="noopener">해성공지</a>
  </footer>
  </div></main>
  <!-- 좁은 화면(바다 블루) 맨 아래 물결 -->
  <svg class="foot-waves" viewBox="0 0 1440 100" preserveAspectRatio="none" aria-hidden="true">
    <path class="fw-back" d="M0,30 C240,70 480,0 720,32 C960,64 1200,6 1440,36 L1440,100 L0,100 Z"/>
    <path class="fw-front" d="M0,62 C220,34 460,92 720,64 C980,36 1220,90 1440,62 L1440,100 L0,100 Z"/>
  </svg>
</div>
<script>
// 화면 구성: 주소 뒤 #info/menu, #notice/b301 처럼 나타냄 → 폰의 뒤로가기로 홈에 돌아올 수 있음
// 정보에 새 항목을 넣을 땐 info.tabs 에 추가하고 RENDER 에 그리는 함수를 연결하면 돼
const SECTIONS = {
  info:   { title: "정보", tabs: [{ id: "menu", label: "학식" }, { id: "sched", label: "학사일정" }] },
  notice: { title: "공지", tabs: [{ id: "b301", label: "해성공지" }, { id: "b264", label: "승선사관부 공지" }] },
};
const RENDER = { menu: () => renderMenu(), sched: () => renderSchedule(), b301: () => renderBoard("b301"), b264: () => renderBoard("b264") };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const data = {};

async function load(file) {
  try {
    const r = await fetch("data/" + file, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch (e) { return null; }
}

function renderMenu() {
  const d = data.menu;
  if (!d) return `<div class="tip">학식 데이터를 불러오지 못했어. 잠시 후 다시 열어봐.</div>`;
  const meal = (name, list) => `<div class="meal"><h3>${name}</h3><ul>${list.map((m) => `<li>${esc(m)}</li>`).join("")}</ul></div>`;
  // 지난 날짜는 빼고 오늘부터 최대 7일치만 날짜순으로
  const todayYmd = todayStr();
  const days = d.items.filter((x) => x.ymd && x.ymd >= todayYmd).sort((a, b) => a.ymd.localeCompare(b.ymd)).slice(0, 7);
  if (!days.length) return `<div class="tip">오늘 이후 식단이 아직 올라오지 않았어. 잠시 후 다시 열어봐.</div>`;
  return days.map((x) => {
    const isToday = x.ymd === todayYmd;
    return `<div class="card ${isToday ? "today" : ""}"><div class="day">${esc(x.date)} <small>${esc(x.dow)}</small>${isToday ? '<span class="badge">오늘</span>' : ""}</div>
      <div class="meals">${meal("아침", x.breakfast)}${meal("점심", x.lunch)}${meal("저녁", x.dinner)}</div></div>`;
  }).join("") + `<div class="meta">※ 승선생활관 식단표 기준</div>`;
}

// ── NEW 배지: 게시일이 오늘 포함 3일 이내 + 이 기기에서 아직 안 눌러본 글 ──
const NEW_DAYS = 3;
const READ_KEY = "readPosts";
let readSet = new Set();
try { readSet = new Set(JSON.parse(localStorage.getItem(READ_KEY) || "[]")); } catch (e) {}

function isRecent(dateStr) {
  const [y, m, d] = (dateStr || "").split("-").map(Number);
  if (!y) return false;
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((today - new Date(y, m - 1, d)) / 86400000); // 며칠 전 글인지
  return diff >= 0 && diff < NEW_DAYS; // 0=오늘, 1=어제, 2=그제
}
const isNew = (p) => isRecent(p.date) && !readSet.has(p.url);
const newCount = (key) => (data[key] ? data[key].items.filter(isNew).length : 0);
const cntBadge = (n) => (n ? `<span class="cnt">${n}</span>` : "");

function markRead(url) {
  readSet.add(url);
  const arr = [...readSet].slice(-500); // 기록이 너무 커지지 않게 최근 500개만 보관
  readSet = new Set(arr);
  try { localStorage.setItem(READ_KEY, JSON.stringify(arr)); } catch (e) {}
}

// 첨부파일 표시 (이모지 대신 선 아이콘)
const CLIP = `<svg class="ic clip" viewBox="0 0 24 24" role="img" aria-label="첨부파일"><path d="M20.5 11.5l-8.2 8.2a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg>`;

function renderBoard(key) {
  const d = data[key];
  if (!d) return `<div class="tip">공지 데이터를 불러오지 못했어. 잠시 후 다시 열어봐.</div>`;
  return d.items.map((p) => `<a class="post ${p.pinned ? "pinned" : ""}" href="${esc(p.url)}" data-url="${esc(p.url)}" target="_blank" rel="noopener">
      <b>${isNew(p) ? '<span class="new">NEW</span>' : ""}${p.pinned ? '<span class="pin">공지</span>' : ""}${esc(p.title)}</b>${p.hasFile ? CLIP : ""}
      <div class="meta">${esc(p.date)}</div></a>`).join("");
}

// ── 학사일정 달력: 월 단위 달력 + 선택한 날 일정 + 그 달 전체 일정 ──
const pad = (n) => String(n).padStart(2, "0");
const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const WD = ["일", "월", "화", "수", "목", "금", "토"];
const todayStr = () => { const n = new Date(); return ymd(n.getFullYear(), n.getMonth() + 1, n.getDate()); };
const dayLabel = (s) => { const [y, m, d] = s.split("-").map(Number); return `${pad(m)}.${pad(d)}(${WD[new Date(y, m - 1, d).getDay()]})`; };
let calMonth = null; // "YYYY-MM" 지금 보고 있는 달
let calSel = null;   // "YYYY-MM-DD" 선택한 날
let calHL = null;    // 목록에서 누른 일정(items 번호) → 달력에 기간 박스 표시

function renderSchedule() {
  const d = data.schedule;
  if (!d || !d.items.length) return `<div class="tip">학사일정을 불러오지 못했어. 잠시 후 다시 열어봐.</div>`;
  const items = d.items;
  const minM = items[0].start.slice(0, 7);
  const maxM = items.reduce((a, e) => (e.end > a ? e.end : a), "").slice(0, 7);
  const today = todayStr();
  if (!calMonth) {
    const cur = today.slice(0, 7);
    calMonth = cur < minM ? minM : cur > maxM ? maxM : cur;
    calSel = today.startsWith(calMonth) ? today : null;
  }
  const [Y, M] = calMonth.split("-").map(Number);
  const lastDay = new Date(Y, M, 0).getDate();
  const firstDow = new Date(Y, M - 1, 1).getDay();
  const on = (ds) => items.filter((e) => e.start <= ds && ds <= e.end);

  let cells = WD.map((w) => `<div class="cal-wd">${w}</div>`).join("");
  cells += "<div></div>".repeat(firstDow);
  const hl = calHL != null ? items[calHL] : null;
  for (let day = 1; day <= lastDay; day++) {
    const ds = ymd(Y, M, day), ev = on(ds);
    const col = (firstDow + day - 1) % 7; // 0=일요일 … 6=토요일
    const inR = hl && hl.start <= ds && ds <= hl.end;
    const cls = ["cal-day", ds === today && "today", ds === calSel && "sel", ev.some((e) => e.holiday) && "hol",
      inR && "rng",
      inR && (ds === hl.start || col === 0 || day === 1) && "rs",       // 박스 왼쪽 닫기
      inR && (ds === hl.end || col === 6 || day === lastDay) && "re",   // 박스 오른쪽 닫기
    ].filter(Boolean).join(" ");
    cells += `<button class="${cls}" data-day="${ds}" aria-label="${M}월 ${day}일, 일정 ${ev.length}개">
      <span class="num">${day}</span>${ev.length ? `<span class="dots">${"<i></i>".repeat(Math.min(ev.length, 3))}</span>` : ""}</button>`;
  }

  const evRow = (e, hit) => `<button class="ev ${hit ? "hit" : ""}" data-i="${items.indexOf(e)}"><span class="ev-date">${dayLabel(e.start)}${e.end !== e.start ? " – " + dayLabel(e.end) : ""}</span>
    <span class="ev-title">${esc(e.title)}</span>${e.holiday ? '<span class="hol-chip">휴일</span>' : ""}</button>`;
  let selBox = "";
  if (calSel) {
    const [, sm, sd] = calSel.split("-").map(Number);
    const list = on(calSel);
    selBox = `<h3 class="sch-title">${sm}월 ${sd}일 일정</h3>` + (list.length ? list.map((e) => evRow(e, true)).join("") : `<p class="empty">이 날은 등록된 일정이 없어.</p>`);
  }
  const mStart = ymd(Y, M, 1), mEnd = ymd(Y, M, lastDay);
  const monthList = items.filter((e) => e.start <= mEnd && e.end >= mStart);

  return `<div class="cal">
      <div class="cal-head">
        <button class="cal-nav" data-dir="-1" aria-label="이전 달" ${calMonth <= minM ? "disabled" : ""}>‹</button>
        <strong>${Y}년 ${M}월</strong>
        <button class="cal-nav" data-dir="1" aria-label="다음 달" ${calMonth >= maxM ? "disabled" : ""}>›</button>
      </div>
      <div class="cal-grid">${cells}</div>
      <div class="cal-legend"><span><i class="lg-dot"></i>일정</span><span><i class="lg-hol"></i>휴일</span></div>
    </div>
    ${selBox}
    <h3 class="sch-title">${M}월 전체 일정</h3>
    ${monthList.length ? monthList.map((e) => evRow(e, hl ? e === hl : calSel && e.start <= calSel && calSel <= e.end)).join("") : `<p class="empty">이 달은 등록된 일정이 없어.</p>`}`;
}

function renderTabs(sec, active) {
  $("#tabs").innerHTML = SECTIONS[sec].tabs.map((t) =>
    `<button class="tab ${t.id === active ? "on" : ""}" data-id="${t.id}">${t.label}${t.id === "menu" ? "" : cntBadge(newCount(t.id))}</button>`).join("");
}

// 주소(#...)를 읽어서 메인화면 또는 정보·공지 화면을 그림
function route() {
  const [sec, tabId] = location.hash.slice(1).split("/");
  const s = SECTIONS[sec];
  if (!s) {
    $("#home").hidden = false; $("#page").hidden = true;
    $("#noticeCnt").innerHTML = cntBadge(newCount("b301") + newCount("b264"));
    window.scrollTo(0, 0);
    return;
  }
  const tab = s.tabs.some((t) => t.id === tabId) ? tabId : s.tabs[0].id;
  $("#home").hidden = true; $("#page").hidden = false;
  $("#pageTitle").textContent = s.title;
  renderTabs(sec, tab);
  $("#view").innerHTML = RENDER[tab]();
  window.scrollTo(0, 0); // 맨 위부터 (학식은 오늘이 첫 카드라 바로 보임)
}

(async () => {
  // 탭 전환은 기록을 덮어써서(replace) 뒤로가기 한 번이면 홈으로 돌아가게 함
  $("#tabs").addEventListener("click", (e) => {
    const b = e.target.closest(".tab");
    if (b) location.replace("#" + location.hash.slice(1).split("/")[0] + "/" + b.dataset.id);
  });
  // 공지를 누르면 읽음 처리 → NEW 배지와 탭 개수 갱신 (원문은 새 창으로 열림)
  $("#view").addEventListener("click", (e) => {
    // 학사일정 달력: 이전/다음 달, 날짜 선택 (화면 위치는 그대로 유지)
    const nav = e.target.closest(".cal-nav"), dayBtn = e.target.closest(".cal-day"), evBtn = e.target.closest(".ev");
    if (nav || dayBtn || evBtn) {
      if (nav) {
        const [y, m] = calMonth.split("-").map(Number);
        const dt = new Date(y, m - 1 + Number(nav.dataset.dir), 1);
        calMonth = `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}`;
        calSel = todayStr().startsWith(calMonth) ? todayStr() : null;
        calHL = null;
      } else if (dayBtn) {
        calSel = dayBtn.dataset.day;
        calHL = null;
      } else {
        // 일정을 누르면: 달력에 그 기간을 박스로 표시하고 맨 위(달력)로 올라감
        calHL = Number(evBtn.dataset.i);
        calSel = null;
      }
      $("#view").innerHTML = renderSchedule();
      if (evBtn) window.scrollTo(0, 0); // 어느 기기에서든 확실하게 바로 맨 위로
      return;
    }
    const a = e.target.closest(".post");
    if (!a) return;
    markRead(a.dataset.url);
    const badge = a.querySelector(".new");
    if (badge) badge.remove();
    const [sec] = location.hash.slice(1).split("/");
    renderTabs(sec, document.querySelector(".tab.on")?.dataset.id);
  });
  window.addEventListener("hashchange", route);

  [data.menu, data.b264, data.b301, data.schedule] = await Promise.all([load("menu.json"), load("board264.json"), load("board301.json"), load("schedule.json")]);
  const t = (data.menu || data.b264 || {}).updatedAt;
  $("#updated").textContent = t ? "데이터 갱신: " + new Date(t).toLocaleString("ko-KR") : "데이터를 불러오지 못했어";
  route();
})();
</script>
</body>
</html>
