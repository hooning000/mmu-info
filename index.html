<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMU INFO</title>
<style>
  @font-face { font-family: "Kakao Big Sans"; font-weight: 400; src: url(fonts/KakaoBigSans-Regular.ttf); }
  @font-face { font-family: "Kakao Big Sans"; font-weight: 700; src: url(fonts/KakaoBigSans-Bold.ttf); }
  @font-face { font-family: "Kakao Big Sans"; font-weight: 800; src: url(fonts/KakaoBigSans-ExtraBold.ttf); }
  :root { --main:#C9B8A3; --sub:#F1EBE3; --point:#CBD5C0; --point-l:#E8EDE2; --ink:#6E6256; }
  * { box-sizing: border-box; }
  body { margin:0; background:#fff; color:var(--ink); font:400 16px/1.6 "Kakao Big Sans", -apple-system, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 40px; }
  .sub { font-size:13px; margin:8px 0 16px; }
  [hidden] { display:none !important; }

  /* ── 메인화면 ── */
  #home { text-align:center; padding-top:8vh; }
  .logo { font-weight:800; font-size:40px; letter-spacing:3px; margin:0; display:inline-block; padding:0 6px 6px; border-bottom:3px solid var(--main); }
  .home-grid { display:flex; justify-content:center; gap:20px; margin:40px 0 24px; flex-wrap:wrap; }
  .tile { position:relative; width:min(40vw, 200px); aspect-ratio:1 / 1; border-radius:28px; background:var(--sub); border:1px solid var(--main);
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-decoration:none; color:var(--ink); transition:transform .1s; }
  .tile:active { transform:scale(.97); }
  .tile-title { font-weight:800; font-size:26px; }
  .tile-desc { font-size:13px; }
  .tile .cnt { position:absolute; top:12px; right:12px; }

  /* ── 정보·공지 화면: 상단바와 탭이 함께 위에 고정 ── */
  .head { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--sub); padding-top:4px; }
  .topbar { display:flex; align-items:center; gap:10px; }
  .back { text-decoration:none; color:var(--ink); font-weight:700; font-size:14px; border:1px solid var(--sub); border-radius:20px; padding:4px 12px; }
  .page-title { font-weight:800; font-size:22px; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; padding:10px 0; }
  .card { scroll-margin-top: 110px; }
  .tab { border:1px solid var(--sub); background:#fff; color:var(--ink); font:700 14px "Kakao Big Sans"; padding:8px 14px; border-radius:20px; cursor:pointer; }
  .tab.on { background:var(--sub); border-color:var(--main); }
  #view { margin-top:16px; }

  .card { border:1px solid var(--sub); border-left:5px solid var(--main); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .card.today { border-left-color: var(--point); background: var(--point-l); }
  .day { font-weight:800; font-size:16px; margin-bottom:6px; }
  .day small { font-weight:400; }
  .badge { font-size:12px; background:#fff; border:1px solid var(--point); border-radius:10px; padding:0 8px; margin-left:6px; }
  .meals { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; }
  .meal h3 { font-size:14px; font-weight:700; margin:0 0 4px; background:var(--sub); padding:2px 8px; border-radius:6px; display:inline-block; }
  .meal ul { margin:0; padding-left:16px; font-size:13px; line-height:1.5; }
  @media (max-width:560px) { .meals { grid-template-columns:1fr; } }
  .post { display:block; text-decoration:none; color:var(--ink); border:1px solid var(--sub); border-radius:10px; padding:10px 14px; margin-bottom:8px; }
  .post:active { background:var(--sub); }
  .post b { font-weight:700; }
  .meta { font-size:12px; margin-top:2px; }
  .pin { font-size:12px; background:var(--sub); border-radius:8px; padding:0 6px; margin-right:6px; }
  .new { font-size:11px; font-weight:800; background:var(--point-l); border:1px solid var(--point); border-radius:8px; padding:0 6px; margin-right:6px; letter-spacing:.5px; }
  .cnt { display:inline-block; min-width:18px; margin-left:6px; padding:0 5px; font-size:11px; font-weight:700; line-height:18px; text-align:center; border-radius:9px; background:var(--point); }
  .tip { background:var(--point-l); border:1px solid var(--point); border-radius:10px; padding:12px 14px; }
  footer { font-size:12px; margin-top:28px; border-top:1px solid var(--sub); padding-top:12px; }
  footer a { color:var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <!-- 메인화면 -->
  <section id="home">
    <h1 class="logo">MMU INFO</h1>
    <div class="home-grid">
      <a class="tile" href="#info"><span class="tile-title">정보</span><span class="tile-desc">학식</span></a>
      <a class="tile" href="#notice"><span class="tile-title">공지</span><span class="tile-desc">해성공지 · 승선사관부</span><span id="noticeCnt"></span></a>
    </div>
    <div class="sub" id="updated">불러오는 중…</div>
  </section>

  <!-- 정보·공지 화면 -->
  <section id="page" hidden>
    <div class="head">
      <div class="topbar"><a class="back" href="#">‹ 홈</a><span class="page-title" id="pageTitle"></span></div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div id="view"></div>
  </section>

  <footer>
    비공식 앱이야. 정확한 내용은 학교 홈페이지에서 꼭 확인해.<br>
    원문:
    <a href="https://www.mmu.ac.kr/main/contents/todayMenu2" target="_blank" rel="noopener">식단표</a> ·
    <a href="https://www.mmu.ac.kr/main/board/264" target="_blank" rel="noopener">승선사관부 공지</a> ·
    <a href="https://www.mmu.ac.kr/main/board/301" target="_blank" rel="noopener">해성공지</a>
  </footer>
</div>
<script>
// 화면 구성: 주소 뒤 #info/menu, #notice/b301 처럼 나타냄 → 폰의 뒤로가기로 홈에 돌아올 수 있음
// 정보에 새 항목을 넣을 땐 info.tabs 에 추가하고 RENDER 에 그리는 함수를 연결하면 돼
const SECTIONS = {
  info:   { title: "정보", tabs: [{ id: "menu", label: "학식" }] },
  notice: { title: "공지", tabs: [{ id: "b301", label: "해성공지" }, { id: "b264", label: "승선사관부 공지" }] },
};
const RENDER = { menu: () => renderMenu(), b301: () => renderBoard("b301"), b264: () => renderBoard("b264") };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const data = {};

async function load(file) {
  try {
    const r = await fetch("data/" + file, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch (e) { return null; }
}

function renderMenu() {
  const d = data.menu;
  if (!d) return `<div class="tip">학식 데이터를 불러오지 못했어. 잠시 후 다시 열어봐.</div>`;
  const now = new Date(), today = `${now.getMonth() + 1}/${now.getDate()}`;
  const meal = (name, list) => `<div class="meal"><h3>${name}</h3><ul>${list.map((m) => `<li>${esc(m)}</li>`).join("")}</ul></div>`;
  return d.items.map((x) => {
    const isToday = x.date === today;
    return `<div class="card ${isToday ? "today" : ""}"><div class="day">${esc(x.date)} <small>${esc(x.dow)}</small>${isToday ? '<span class="badge">오늘</span>' : ""}</div>
      <div class="meals">${meal("아침", x.breakfast)}${meal("점심", x.lunch)}${meal("저녁", x.dinner)}</div></div>`;
  }).join("") + `<div class="meta">※ 승선생활관 식단표 기준</div>`;
}

// ── NEW 배지: 게시일이 오늘 포함 3일 이내 + 이 기기에서 아직 안 눌러본 글 ──
const NEW_DAYS = 3;
const READ_KEY = "readPosts";
let readSet = new Set();
try { readSet = new Set(JSON.parse(localStorage.getItem(READ_KEY) || "[]")); } catch (e) {}

function isRecent(dateStr) {
  const [y, m, d] = (dateStr || "").split("-").map(Number);
  if (!y) return false;
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((today - new Date(y, m - 1, d)) / 86400000); // 며칠 전 글인지
  return diff >= 0 && diff < NEW_DAYS; // 0=오늘, 1=어제, 2=그제
}
const isNew = (p) => isRecent(p.date) && !readSet.has(p.url);
const newCount = (key) => (data[key] ? data[key].items.filter(isNew).length : 0);
const cntBadge = (n) => (n ? `<span class="cnt">${n}</span>` : "");

function markRead(url) {
  readSet.add(url);
  const arr = [...readSet].slice(-500); // 기록이 너무 커지지 않게 최근 500개만 보관
  readSet = new Set(arr);
  try { localStorage.setItem(READ_KEY, JSON.stringify(arr)); } catch (e) {}
}

function renderBoard(key) {
  const d = data[key];
  if (!d) return `<div class="tip">공지 데이터를 불러오지 못했어. 잠시 후 다시 열어봐.</div>`;
  return d.items.map((p) => `<a class="post" href="${esc(p.url)}" data-url="${esc(p.url)}" target="_blank" rel="noopener">
      <b>${isNew(p) ? '<span class="new">NEW</span>' : ""}${p.pinned ? '<span class="pin">공지</span>' : ""}${esc(p.title)}</b>${p.hasFile ? " 📎" : ""}
      <div class="meta">${esc(p.date)}</div></a>`).join("");
}

function renderTabs(sec, active) {
  $("#tabs").innerHTML = SECTIONS[sec].tabs.map((t) =>
    `<button class="tab ${t.id === active ? "on" : ""}" data-id="${t.id}">${t.label}${t.id === "menu" ? "" : cntBadge(newCount(t.id))}</button>`).join("");
}

// 주소(#...)를 읽어서 메인화면 또는 정보·공지 화면을 그림
function route() {
  const [sec, tabId] = location.hash.slice(1).split("/");
  const s = SECTIONS[sec];
  if (!s) {
    $("#home").hidden = false; $("#page").hidden = true;
    $("#noticeCnt").innerHTML = cntBadge(newCount("b301") + newCount("b264"));
    window.scrollTo(0, 0);
    return;
  }
  const tab = s.tabs.some((t) => t.id === tabId) ? tabId : s.tabs[0].id;
  $("#home").hidden = true; $("#page").hidden = false;
  $("#pageTitle").textContent = s.title;
  renderTabs(sec, tab);
  $("#view").innerHTML = RENDER[tab]();
  const td = document.querySelector(".card.today");
  if (td) td.scrollIntoView({ block: "start" }); // 학식: 오늘 식단으로 바로 이동
  else window.scrollTo(0, 0);                    // 공지: 맨 위부터
}

(async () => {
  // 탭 전환은 기록을 덮어써서(replace) 뒤로가기 한 번이면 홈으로 돌아가게 함
  $("#tabs").addEventListener("click", (e) => {
    const b = e.target.closest(".tab");
    if (b) location.replace("#" + location.hash.slice(1).split("/")[0] + "/" + b.dataset.id);
  });
  // 공지를 누르면 읽음 처리 → NEW 배지와 탭 개수 갱신 (원문은 새 창으로 열림)
  $("#view").addEventListener("click", (e) => {
    const a = e.target.closest(".post");
    if (!a) return;
    markRead(a.dataset.url);
    const badge = a.querySelector(".new");
    if (badge) badge.remove();
    const [sec] = location.hash.slice(1).split("/");
    renderTabs(sec, document.querySelector(".tab.on")?.dataset.id);
  });
  window.addEventListener("hashchange", route);

  [data.menu, data.b264, data.b301] = await Promise.all([load("menu.json"), load("board264.json"), load("board301.json")]);
  const t = (data.menu || data.b264 || {}).updatedAt;
  $("#updated").textContent = t ? "데이터 갱신: " + new Date(t).toLocaleString("ko-KR") : "데이터를 불러오지 못했어";
  route();
})();
</script>
</body>
</html>
